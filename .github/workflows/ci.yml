name: Build, Push & Update Helm Values

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  DOCKER_USER: nawnwa
  FRONTEND_IMAGE: nawnwa/portfolio-frontend
  BACKEND_IMAGE: nawnwa/portfolio-backend
  GITOPS_REPO: nawazishkhan3009/portfolio-gitops

jobs:
  # ── Go formatting (PRs only) ──
  format:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'

      - name: Format and auto‑commit
        run: |
          gofmt -w .
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "style: gofmt"
            git push
          fi

  # ── Build, push & update GitOps (only on push to main) ──
  build-and-update:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Update Helm values in GitOps repo
        run: |
          git clone https://x-access-token:${{ secrets.GITOPS_PAT }}@github.com/${{ env.GITOPS_REPO }}.git gitops
          cd gitops/charts/portfolio

          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq

          yq e ".frontend.image.tag = \"${{ github.sha }}\"" -i values.yaml
          yq e ".backend.image.tag = \"${{ github.sha }}\"" -i values.yaml

          git config user.name "CI Bot"
          git config user.email "ci-bot@nawazishkhan.dev"
          git add values.yaml
          git commit -m "Update image tags to ${{ github.sha }}" || echo "Nothing to commit"
          git push